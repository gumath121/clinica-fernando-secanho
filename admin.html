
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel da Clínica</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      color: #17304d;
    }
    header {
      background: #12345a;
      color: white;
      padding: 22px;
      text-align: center;
    }
    main {
      max-width: 760px;
      margin: 35px auto;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 18px #00000012;
    }
    button {
      background: #12345a;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
    }
    #status { line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <h1>Clínica de Cardiologia</h1>
    <p>Painel restrito da equipe</p>
  </header>

  <main>
    <h2>Área administrativa</h2>
    <p id="status">Verificando autenticação...</p>
    <button id="sair" hidden>Sair</button>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://gvmoruslfkbtpsmnbqlu.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_13EfTkH1D2I9WaDvShy6zg_d5a_KYhu";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const status = document.getElementById("status");
    const botaoSair = document.getElementById("sair");

    async function verificarAcesso() {
      const { data, error } = await supabase.auth.getUser();

      if (error || !data.user) {
        status.textContent =
          "Entre primeiro no portal para autenticar sua conta.";
        return;
      }

      const { data: perfil, error: erroPerfil } = await supabase
        .from("perfis")
        .select("nome, tipo, ativo")
        .eq("id", data.user.id)
        .maybeSingle();

      if (erroPerfil || !perfil || !perfil.ativo ||
          !["medico", "secretaria"].includes(perfil.tipo)) {
        status.textContent =
          "Acesso restrito à equipe autorizada da clínica.";
        return;
      }

      status.textContent =
        `Bem-vindo(a), ${perfil.nome}. Perfil: ${perfil.tipo}. ` +
        "O painel foi autenticado. As funções administrativas serão adicionadas na próxima etapa.";

      botaoSair.hidden = false;
    }

    botaoSair.addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "portal.html";
    });

    verificarAcesso();
  </script>
</body>
</html>
