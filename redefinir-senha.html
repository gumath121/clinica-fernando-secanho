    import { createClient } from

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const confirmacao = document.getElementById("confirmacao");

    function mostrar(texto, tipo = "") {
      mensagem.textContent = texto;

    async function prepararRecuperacao() {
      const hash = window.location.hash.slice(1);
      const parametros = new URLSearchParams(hash);
      const erroUrl = parametros.get("error_description");

      if (erroUrl) {
        mostrar("O link não é válido ou expirou. Solicite um novo link à clínica.", "erro");
        botao.disabled = true;
        return;
      }

      const accessToken = parametros.get("access_token");
      const refreshToken = parametros.get("refresh_token");
      const tipo = parametros.get("type");

      if (accessToken && refreshToken && tipo === "recovery") {
        const { error } = await supabase.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });

        if (error) {
          mostrar("Não foi possível validar o link. Solicite um novo acesso à clínica.", "erro");
          botao.disabled = true;
          return;
        }

        history.replaceState(null, "", window.location.pathname);
        mostrar("Link validado. Você já pode criar sua senha.");
        return;
      }

      const { data, error } = await supabase.auth.getSession();

      if (error || !data.session) {
        mostrar("Abra o link de recuperação mais recente enviado pela clínica.", "erro");
        botao.disabled = true;
        return;

      mostrar("Sessão de recuperação encontrada. Você já pode criar sua senha.");

        return;
      }

      if (senha.value !== confirmacao.value) {
        mostrar("As senhas não são iguais.", "erro");
        return;
      }

      botao.disabled = true;
      mostrar("Salvando sua senha...");

          await supabase.auth.getSession();

        if (sessionError || !sessionData.session) {

          return;
        }

          password: senha.value
        });

          return;
        }

        await supabase.auth.signOut();

setTimeout(() => {

      } finally {
        botao.disabled = false;
      }
    });

    prepararRecuperacao();
  </script>
